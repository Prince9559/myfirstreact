 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Style Radio Button</title>
  <style>
    
    

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .radio {
      position: relative;
      width: 20px;
      height: 20px;
    }

    .radio input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 100%;
      border: 2px solid #1a73e8;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease-in-out;
      position: relative;
    }

    .radio input[type="radio"]:checked::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: #1a73e8;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="radio-group">
    <label class="radio">
      <input type="radio" name="choose" />
    </label>

    <label class="radio">
      <input type="radio" name="choose" checked />
    </label>
  </div>

</body>
</html>
